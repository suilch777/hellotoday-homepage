<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>운영 기록 | 오늘어때?</title>
  <link rel="stylesheet" href="./operator.css" />
  <link rel="stylesheet" href="./audit.css?v=13" />
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">SERVICE OPERATIONS</p>
        <h1>운영 기록</h1>
        <p class="page-description">
          공지사항 관리와 이용자 정지·해제 등 운영자 변경 이력을 확인합니다.
        </p>
      </div>
      <a class="home-link" href="/operator/">운영 현황으로 돌아가기</a>
    </header>

    <section id="checkingSection" class="panel">
      <div class="loading-row">
        <div class="spinner" aria-hidden="true"></div>
        <div>
          <h2>운영자 권한을 확인하고 있습니다.</h2>
          <p class="help-text">관리자 인증 후 운영 기록을 불러옵니다.</p>
        </div>
      </div>
    </section>

    <section id="auditSection" hidden>
      <div class="audit-topbar">
        <div>
          <span class="badge badge-live">관리자 인증</span>
          <p id="signedInInfo" class="help-text signed-in-info"></p>
        </div>
        <div class="dashboard-actions">
          <button id="refreshButton" class="button button-secondary" type="button">새로고침</button>
          <button id="logoutButton" class="button button-outline" type="button">로그아웃</button>
        </div>
      </div>

      <section class="panel">
        <div class="section-heading">
          <div>
            <span class="section-kicker">AUDIT LOG</span>
            <h2>변경 기록</h2>
            <p class="help-text">
              현재는 공지 등록·수정·숨김·재공개와 이용자 정지·정지 해제만 표시합니다.
            </p>
          </div>
        </div>

        <div class="audit-summary">
          <span id="totalCountBadge" class="badge badge-muted">전체 0</span>
          <span id="noticeCountBadge" class="badge badge-muted">공지 0</span>
          <span id="userCountBadge" class="badge badge-muted">이용자 0</span>
        </div>

        <p id="pageMessage" class="message" aria-live="polite"></p>
      </section>

      <section class="panel audit-list-panel">
        <div class="audit-table-wrap">
          <table class="audit-table">
            <thead>
              <tr>
                <th>일시</th>
                <th>구분</th>
                <th>작업</th>
                <th>대상</th>
                <th>운영자</th>
              </tr>
            </thead>
            <tbody id="auditTableBody"></tbody>
          </table>
        </div>

        <div id="auditCardList" class="audit-card-list"></div>
        <div id="emptyState" class="audit-empty" hidden>표시할 운영 기록이 없습니다.</div>
      </section>
    </section>

    <footer class="footer">
      <a href="/operator/">운영 현황으로 돌아가기</a>
      <span>·</span>
      <a href="/" data-operator-home-exit="true">홈으로 돌아가기</a>
    </footer>
  </main>

  <script src="/__/firebase/8.10.1/firebase-app.js"></script>
  <script src="/__/firebase/8.10.1/firebase-auth.js"></script>
  <script src="/__/firebase/8.10.1/firebase-firestore.js"></script>
  <script src="/__/firebase/init.js"></script>
  <script src="./session-timeout.js?v=10"></script>
  <script src="./audit.js?v=16"></script>
</body>
</html>
