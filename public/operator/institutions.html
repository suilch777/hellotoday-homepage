<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>기관 계정 | 오늘어때?</title><link rel="stylesheet" href="./operator.css"><link rel="stylesheet" href="./institutions.css?v=3">
</head><body><main class="page-shell">
<header class="page-header"><div><p class="eyebrow">INSTITUTION ACCOUNTS</p><h1>기관 계정</h1><p class="page-description">기관 가입 신청을 확인하고 승인 및 이용 상태를 관리합니다.</p></div><a class="home-link" href="/operator/">운영 현황으로 돌아가기</a></header>
<section id="checkingSection" class="panel"><h2>운영자 권한을 확인하고 있습니다.</h2><p id="checkingMessage" class="message" role="status"></p></section>
<section id="institutionsSection" hidden>
  <div class="dashboard-top"><p id="signedInInfo" class="help-text"></p><div class="dashboard-actions"><button id="refreshButton" class="button button-secondary" type="button">새로고침</button><button id="logoutButton" class="button button-outline" type="button">로그아웃</button></div></div>
  <section class="panel"><div id="statusTabs" class="status-tabs" role="tablist" aria-label="기관 계정 상태"><button type="button" role="tab" data-status="PENDING" aria-selected="true">승인 대기 <strong>0</strong></button><button type="button" role="tab" data-status="APPROVED" aria-selected="false">승인 완료 <strong>0</strong></button><button type="button" role="tab" data-status="REJECTED" aria-selected="false">반려 <strong>0</strong></button><button type="button" role="tab" data-status="SUSPENDED" aria-selected="false">이용 정지 <strong>0</strong></button></div><input id="statusFilter" type="hidden" value="PENDING"><p id="pageMessage" class="message" role="status" aria-live="polite"></p></section>
  <div id="institutionList" class="institution-list"></div><p id="emptyState" class="panel" hidden>해당 상태의 기관 계정이 없습니다.</p>
  <button id="loadMoreButton" class="button button-secondary" type="button" hidden>더 보기</button>
</section>
<footer class="footer"><a href="/operator/">운영 현황으로 돌아가기</a><span>·</span><a href="/" data-operator-home-exit="true">홈으로 돌아가기</a></footer>
</main>
<dialog id="reviewDialog" aria-labelledby="reviewTitle"><form id="reviewForm"><h2 id="reviewTitle"></h2><p id="reviewDescription"></p><label id="newPhoneField" class="field" hidden>변경할 담당자 휴대전화<input id="newPhone" type="tel" maxlength="20" placeholder="01012345678"></label><label id="reasonField" class="field">사유 (기관에 표시됩니다)<textarea id="reviewReason" maxlength="500" rows="4"></textarea></label><p id="reviewMessage" class="message" role="alert"></p><div class="dashboard-actions"><button id="cancelReview" class="button button-outline" type="button">취소</button><button id="confirmReview" class="button button-primary" type="submit">처리</button></div></form></dialog>
<script src="/__/firebase/8.10.1/firebase-app.js"></script><script src="/__/firebase/8.10.1/firebase-auth.js"></script><script src="/__/firebase/8.10.1/firebase-functions.js"></script><script src="/__/firebase/init.js"></script><script src="./session-timeout.js?v=10"></script><script src="./institutions.js?v=5"></script>
</body></html>
