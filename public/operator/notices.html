<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>공지 관리 | 오늘어때?</title>
  <link rel="stylesheet" href="./operator.css" />
  <link rel="stylesheet" href="./notices.css?v=12" />
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">SERVICE OPERATIONS</p>
        <h1>공지 관리</h1>
        <p class="page-description">
          앱에 표시되는 공지사항을 등록하고 공개 상태를 관리합니다.
        </p>
      </div>
      <a class="home-link" href="/operator/">운영 현황으로 돌아가기</a>
    </header>

    <section id="checkingSection" class="panel">
      <div class="loading-row">
        <div class="spinner" aria-hidden="true"></div>
        <div>
          <h2>운영자 권한을 확인하고 있습니다.</h2>
          <p class="help-text">관리자 인증 후 공지사항을 불러옵니다.</p>
        </div>
      </div>
    </section>

    <section id="noticesSection" hidden>
      <div class="notices-topbar">
        <div>
          <span class="badge badge-live">관리자 인증</span>
          <p id="signedInInfo" class="help-text signed-in-info"></p>
        </div>

        <div class="dashboard-actions">
          <button id="refreshButton" class="button button-secondary" type="button">
            새로고침
          </button>
          <button id="logoutButton" class="button button-outline" type="button">
            로그아웃
          </button>
        </div>
      </div>

      <section class="panel">
        <div class="notice-toolbar">
          <div>
            <span class="section-kicker">NOTICE MANAGEMENT</span>
            <h2>공지사항</h2>
            <p class="help-text">
              공개 공지는 앱의 공지사항 화면에 표시됩니다. 중요 공지는 앱에서 중요 안내로 처리됩니다.
            </p>
          </div>
          <div class="dashboard-actions">
            <button id="newNoticeButton" class="button button-primary" type="button">
              새 공지 작성
            </button>
          </div>
        </div>

        <div class="notice-summary">
          <span id="totalCountBadge" class="badge badge-muted">전체 0</span>
          <span id="publicCountBadge" class="badge badge-live">공개 0</span>
          <span id="importantCountBadge" class="badge badge-muted">중요 0</span>
        </div>

        <p id="pageMessage" class="message" aria-live="polite"></p>
      </section>

      <section class="panel">
        <div id="noticeList" class="notice-list"></div>
        <div id="emptyState" class="notice-empty" hidden>
          등록된 공지사항이 없습니다.
        </div>
      </section>
    </section>

    <footer class="footer">
      <a href="/operator/">운영 현황으로 돌아가기</a>
      <span>·</span>
      <a href="/" data-operator-home-exit="true">홈으로 돌아가기</a>
    </footer>
  </main>

  <div id="editorModal" class="notice-editor-modal" hidden>
    <div class="notice-editor-dialog" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
      <p class="section-kicker">NOTICE EDITOR</p>
      <h2 id="editorTitle">새 공지 작성</h2>

      <form id="noticeForm">
        <div class="notice-editor-grid">
          <label class="notice-field">
            <span>제목</span>
            <input id="noticeTitleInput" type="text" maxlength="120" autocomplete="off" />
          </label>

          <label class="notice-field">
            <span>내용</span>
            <textarea id="noticeContentInput" maxlength="5000"></textarea>
          </label>

          <div class="notice-options">
            <label class="notice-option">
              <input id="noticeImportantInput" type="checkbox" />
              <span>
                <strong>중요 공지</strong>
                <small>앱에서 중요 안내로 구분합니다.</small>
              </span>
            </label>

            <label class="notice-option">
              <input id="noticeActiveInput" type="checkbox" checked />
              <span>
                <strong>바로 공개</strong>
                <small>해제하면 저장만 하고 이용자에게는 표시하지 않습니다.</small>
              </span>
            </label>
          </div>
        </div>

        <p id="editorMessage" class="message" aria-live="polite"></p>

        <div class="notice-editor-actions">
          <button id="cancelEditButton" class="button button-outline" type="button">취소</button>
          <button id="saveNoticeButton" class="button button-primary" type="submit">등록</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/__/firebase/8.10.1/firebase-app.js"></script>
  <script src="/__/firebase/8.10.1/firebase-auth.js"></script>
  <script src="/__/firebase/8.10.1/firebase-firestore.js"></script>
  <script src="/__/firebase/8.10.1/firebase-functions.js"></script>
  <script src="/__/firebase/init.js"></script>

  <script src="./session-timeout.js?v=10"></script>
  <script src="./notices.js?v=13"></script>
</body>
</html>
